<div class="simple-article-detail-page">
  <div class="simple-article-detail-header">
    <img class="simple-article-detail-logo" src="{{siteLogo}}" alt="logo" onerror="this.style.display='none'" />
    <div class="simple-article-detail-site">{{siteName}}</div>
  </div>
  <div class="simple-article-detail-card">
    <h1 class="simple-article-detail-title">{{articleTitle}}</h1>
    <div class="simple-article-detail-date">{{articleDate}}</div>
    <div class="simple-article-detail-content">{{articleContentHtml}}</div>
  </div>
</div>
