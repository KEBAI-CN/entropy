<div class="simple-home">
  <div class="simple-home-topbar">
    <div class="simple-home-brand">
      <img class="simple-home-logo" src="{{siteLogo}}" alt="logo" onerror="this.style.display='none'" />
      <span class="simple-home-brand-name">{{siteName}}</span>
    </div>
    <div class="simple-home-nav">
      <span>首页</span>
      <span>订单查询</span>
      <span>平台文章</span>
    </div>
  </div>
  <div class="simple-home-card">
    <h1 class="simple-home-title">欢迎来到 {{siteName}}</h1>
    <p class="simple-home-desc">{{siteDescription}}</p>
    <div class="simple-home-keywords">关键词：{{siteKeywords}}</div>
    <div class="simple-home-grid">
      <div class="simple-home-item">
        <div class="simple-home-item-title">快速开店</div>
        <div class="simple-home-item-desc">几分钟完成店铺搭建与基础配置。</div>
      </div>
      <div class="simple-home-item">
        <div class="simple-home-item-title">订单可追踪</div>
        <div class="simple-home-item-desc">支持游客查询订单状态与支付信息。</div>
      </div>
      <div class="simple-home-item">
        <div class="simple-home-item-title">内容可运营</div>
        <div class="simple-home-item-desc">通过文章页发布公告、教程和活动。</div>
      </div>
    </div>
  </div>
  <div class="simple-home-footer">
    <div>{{siteCopyright}}</div>
    <div>{{siteIcp}}</div>
    <div>{{siteDianzeng}}</div>
  </div>
</div>
