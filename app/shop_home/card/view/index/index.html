<!doctype html>
<html lang="zh-CN">
  <head>
    <title>{$shopName|default='店铺首页'}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <style>
      html, body, #app { height: 100%; margin: 0; padding: 0; }
      html { background-color: #fafbfc; }
      .app-loading { display:flex; align-items:center; justify-content:center; height:100%; }
      .app-loading-grid { width:48px; height:48px; display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
      .app-loading-block { width:100%; height:100%; border-radius:6px; background:#165dff; animation:lb 1.1s ease-in-out infinite; }
      .app-loading-block:nth-child(1){animation-delay:0s}.app-loading-block:nth-child(2){animation-delay:.1s}.app-loading-block:nth-child(3){animation-delay:.2s}.app-loading-block:nth-child(4){animation-delay:.1s}.app-loading-block:nth-child(5){animation-delay:.2s}.app-loading-block:nth-child(6){animation-delay:.3s}.app-loading-block:nth-child(7){animation-delay:.2s}.app-loading-block:nth-child(8){animation-delay:.3s}.app-loading-block:nth-child(9){animation-delay:.4s}
      @keyframes lb{0%,70%,100%{transform:scale(.72);opacity:.38}35%{transform:scale(1);opacity:1}}
    </style>
    <script type="module" crossorigin src="/templates/shop_home/card/assets/js/index-CdyL-m6A.js"></script>
    <link rel="modulepreload" crossorigin href="/templates/shop_home/card/assets/js/rolldown-runtime-NMqb_1LM.js">
    <link rel="modulepreload" crossorigin href="/templates/shop_home/card/assets/js/vendor-arco-cyifokN2.js">
    <link rel="modulepreload" crossorigin href="/templates/shop_home/card/assets/js/vendor-core-DDNkNYl5.js">
    <link rel="stylesheet" crossorigin href="/templates/shop_home/card/assets/css/vendor-arco-It4oFdYg.css">
    <link rel="stylesheet" crossorigin href="/templates/shop_home/card/assets/css/index-X4-PdIyv.css">
  </head>
  <body>
    <script type="application/json" id="shop-public-preload">{$shopPublicPreloadJson|raw}</script>
    <script>
      ;(function () {
        try {
          var el = document.getElementById('shop-public-preload')
          window.__preloadedShopPublicIndex = JSON.parse((el && el.textContent) || '{}')
        } catch (e) {
          window.__preloadedShopPublicIndex = {}
        }
      })()
    </script>
    <div id="app"><div class="app-loading"><div class="app-loading-grid"><i class="app-loading-block"></i><i class="app-loading-block"></i><i class="app-loading-block"></i><i class="app-loading-block"></i><i class="app-loading-block"></i><i class="app-loading-block"></i><i class="app-loading-block"></i><i class="app-loading-block"></i><i class="app-loading-block"></i></div></div></div>
  </body>
</html>
